<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Loop campus event workflow cover</title>
  <desc id="desc">Dark campus product-system artwork with event nodes, map pins, RSVP, chat, and carpool workflow paths.</desc>
  <defs>
