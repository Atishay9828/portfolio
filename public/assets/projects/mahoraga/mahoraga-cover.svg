<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mahoraga adaptive boss system cover</title>
  <desc id="desc">Dark adaptive boss system artwork with an adaptation wheel, reward-loop paths, and combat arena signals.</desc>
  <defs>
    <radialGradient id="bossGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(611 337) rotate(90) scale(263 318)">
      <stop stop-color="#2EF2C5" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#E7F75A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070809" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="285" y1="112" x2="917" y2="582" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EF2C5"/>
      <stop offset="0.5" stop-color="#E7F75A"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#2EF2C5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
