<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mahoraga system loop diagram</title>
  <desc id="desc">Prototype flow from UI and API into environment state, mechanics, curriculum enemy pressure, reward scoring, Gym wrapper, and optional LoRA training loop.</desc>
  <rect width="1200" height="720" fill="#070809"/>
  <g fill="none" stroke="#25313b" stroke-width="1">
    <path d="M80 132h1040M80 270h1040M80 408h1040M80 546h1040"/>
    <path d="M260 86v560M520 86v560M780 86v560M1040 86v560"/>
  </g>
  <text x="72" y="66" fill="#f2f5f7" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700">Mahoraga</text>
  <text x="72" y="98" fill="#9aa4af" font-family="JetBrains Mono, Consolas, monospace" font-size="14">Adaptive environment and reward-training boundary</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2ef2c5"/>
    </marker>
    <style>
      .node{fill:#111417;stroke:#3b4651;stroke-width:2;rx:8}
      .strong{fill:#111417;stroke:#2ef2c5;stroke-width:2;rx:8}
      .proof{fill:#111417;stroke:#e7f75a;stroke-width:2;rx:8}
      .label{fill:#f2f5f7;font-family:Space Grotesk,Arial,sans-serif;font-size:19px;font-weight:700}
      .small{fill:#9aa4af;font-family:JetBrains Mono,Consolas,monospace;font-size:12px}
      .edge{stroke:#2ef2c5;stroke-width:2.5;marker-end:url(#arrow)}
      .muted{stroke:#3b4651;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <g>
    <rect class="strong" x="72" y="164" width="190" height="88"/>
    <text class="label" x="96" y="198">Player / UI</text>
    <text class="small" x="96" y="224">Gradio or game surface</text>

    <rect class="strong" x="342" y="164" width="190" height="88"/>
    <text class="label" x="366" y="198">FastAPI layer</text>
    <text class="small" x="366" y="224">request and simulation calls</text>

    <rect class="proof" x="612" y="164" width="210" height="88"/>
    <text class="label" x="636" y="198">Environment state</text>
    <text class="small" x="636" y="224">health, distance, cooldowns</text>

    <rect class="node" x="902" y="164" width="210" height="88"/>
    <text class="label" x="926" y="198">Mechanics</text>
    <text class="small" x="926" y="224">movement, combat, updates</text>

    <rect class="node" x="612" y="322" width="210" height="88"/>
    <text class="label" x="636" y="356">Curriculum enemy</text>
    <text class="small" x="636" y="382">pressure changes over time</text>

    <rect class="proof" x="902" y="322" width="210" height="88"/>
    <text class="label" x="926" y="356">Reward scoring</text>
    <text class="small" x="926" y="382">survival, combat, adaptation</text>

    <rect class="node" x="342" y="482" width="190" height="88"/>
    <text class="label" x="366" y="516">Gym wrapper</text>
    <text class="small" x="366" y="542">step, reset, observation</text>

    <rect class="node" x="72" y="482" width="190" height="88"/>
    <text class="label" x="96" y="516">Training path</text>
    <text class="small" x="96" y="542">optional LoRA / Qwen work</text>

    <path class="edge" d="M262 208h74"/>
    <path class="edge" d="M532 208h74"/>
    <path class="edge" d="M822 208h74"/>
    <path class="edge" d="M1007 252v64"/>
    <path class="edge" d="M902 366h-74"/>
    <path class="edge" d="M717 322v-64"/>
    <path class="muted" d="M612 526h-74"/>
    <path class="muted" d="M342 526h-74"/>
    <path class="muted" d="M167 482V258"/>
  </g>
  <text x="72" y="650" fill="#9aa4af" font-family="JetBrains Mono, Consolas, monospace" font-size="13">Boundary: prototype architecture evidence only; no broad adaptive-intelligence claim.</text>
</svg>
