      <text x="29" y="45" fill="#2EF2C5" font-size="21">MERCHANT</text>
      <text x="36" y="73" fill="#9AA4AF" font-size="17">override</text>
      <path d="M43 119H117M43 142H94" stroke="#E7F75A" stroke-width="7" stroke-linecap="square"/>
    </g>

