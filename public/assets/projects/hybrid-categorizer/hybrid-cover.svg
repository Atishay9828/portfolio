<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid transaction routing and local AI fallback cover</title>
  <desc id="desc">Dark model-routing artwork showing transaction cards, merchant override, ONNX inference, confidence gate, and offline Qwen fallback.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#7CC7FF" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="pathGrad" x1="137" y1="337" x2="1032" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EF2C5"/>
      <stop offset="0.5" stop-color="#7CC7FF"/>
      <stop offset="1" stop-color="#E7F75A"/>
    </linearGradient>
    <radialGradient id="privacyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(771 337) rotate(90) scale(250 330)">
      <stop stop-color="#7CC7FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#070809" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#070809"/>
