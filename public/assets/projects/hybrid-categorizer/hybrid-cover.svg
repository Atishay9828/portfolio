  <rect x="57" y="53" width="1086" height="569" rx="18" fill="#0B0E12" stroke="#273039"/>
  <circle cx="771" cy="337" r="300" fill="url(#privacyGlow)"/>

  <g stroke="url(#pathGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M261 337H397"/>
    <path d="M543 337H673"/>
    <path d="M813 337H941"/>
  </g>
  <path d="M659 337C659 421 571 450 501 474" stroke="#FF6A3D" stroke-width="4" stroke-dasharray="12 12" stroke-linecap="round"/>
  <path d="M501 474H399" stroke="#FF6A3D" stroke-width="4" stroke-dasharray="12 12" stroke-linecap="round"/>

  <g font-family="JetBrains Mono, Consolas, monospace" font-weight="700">
    <g transform="translate(108 218)">
      <rect width="162" height="238" rx="14" fill="#101419" stroke="#3B4651"/>
      <text x="26" y="45" fill="#2EF2C5" font-size="21">TXN QUEUE</text>
      <rect x="24" y="73" width="114" height="30" rx="6" fill="#171C22" stroke="#273039"/>
      <rect x="24" y="119" width="92" height="30" rx="6" fill="#171C22" stroke="#273039"/>
      <rect x="24" y="165" width="126" height="30" rx="6" fill="#171C22" stroke="#273039"/>
