<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid categorizer memory feedback diagram</title>
  <desc id="desc">Feedback flow from prediction through user correction into merchant memory, history, and insight generation.</desc>
  <rect width="1200" height="720" fill="#070809"/>
  <text x="72" y="66" fill="#f2f5f7" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700">Memory Feedback</text>
  <text x="72" y="98" fill="#9aa4af" font-family="JetBrains Mono, Consolas, monospace" font-size="14">Correction-driven merchant memory and history context</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2ef2c5"/>
    </marker>
    <style>
      .node{fill:#111417;stroke:#3b4651;stroke-width:2;rx:8}
      .strong{fill:#111417;stroke:#2ef2c5;stroke-width:2;rx:8}
      .proof{fill:#111417;stroke:#e7f75a;stroke-width:2;rx:8}
      .warn{fill:#111417;stroke:#ff6a3d;stroke-width:2;rx:8}
      .label{fill:#f2f5f7;font-family:Space Grotesk,Arial,sans-serif;font-size:18px;font-weight:700}
      .small{fill:#9aa4af;font-family:JetBrains Mono,Consolas,monospace;font-size:12px}
      .edge{stroke:#2ef2c5;stroke-width:2.5;marker-end:url(#arrow)}
      .muted{stroke:#3b4651;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <g>
    <rect class="strong" x="76" y="168" width="198" height="86"/>
    <text class="label" x="100" y="202">Prediction</text>
    <text class="small" x="100" y="228">category plus route tag</text>

    <rect class="proof" x="360" y="168" width="198" height="86"/>
    <text class="label" x="384" y="202">User correction</text>
    <text class="small" x="384" y="228">explicit feedback only</text>

    <rect class="node" x="644" y="168" width="220" height="86"/>
    <text class="label" x="668" y="202">Merchant memory</text>
    <text class="small" x="668" y="228">learned merchant-category map</text>

    <rect class="node" x="930" y="168" width="190" height="86"/>
    <text class="label" x="954" y="202">Next prediction</text>
    <text class="small" x="954" y="228">override considered first</text>

    <rect class="node" x="360" y="356" width="198" height="86"/>
    <text class="label" x="384" y="390">History</text>
    <text class="small" x="384" y="416">transactions and categories</text>

    <rect class="warn" x="644" y="356" width="220" height="86"/>
    <text class="label" x="668" y="390">Insight request</text>
    <text class="small" x="668" y="416">same-category context</text>

    <rect class="proof" x="930" y="356" width="190" height="86"/>
    <text class="label" x="954" y="390">AI Insight panel</text>
    <text class="small" x="954" y="416">source-backed text only</text>

    <rect class="node" x="360" y="532" width="504" height="72"/>
    <text class="label" x="384" y="564">Boundary</text>
    <text class="small" x="384" y="588">memory changes require explicit feedback; screenshots are sample/demo data</text>

    <path class="edge" d="M274 211h80"/>
    <path class="edge" d="M558 211h80"/>
    <path class="edge" d="M864 211h60"/>
    <path class="muted" d="M459 254v96"/>
    <path class="edge" d="M558 399h80"/>
    <path class="edge" d="M864 399h60"/>
    <path class="muted" d="M754 254v96"/>
    <path class="muted" d="M612 532V448"/>
  </g>
  <text x="72" y="650" fill="#9aa4af" font-family="JetBrains Mono, Consolas, monospace" font-size="13">Boundary: this diagram documents data flow, not model quality, accuracy, or production usage volume.</text>
</svg>
